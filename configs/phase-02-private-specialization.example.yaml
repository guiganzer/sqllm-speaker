# Copie para um arquivo local de execução. Não registre paths, hashes ou rótulos que revelem dados privados.
project:
  name: sqllm-speaker
  phase: private-schema-specialization
  seed: 42
input:
  dialect: postgres
  queries_jsonl: data/raw/private/queries.jsonl
  base_schema: data/raw/private/schema.sql
  # Obrigatório quando houver raw_* ou vw_ep_* criadas dinamicamente.
  endpoint_manifest: data/raw/private/endpoints.jsonl
  validation_percent: 10
  test_percent: 10
  output_label: private-initial
  # O DDL completo de 619 KB não cabe no contexto de treino; usar fatias compactas por consulta.
  max_schema_characters: 6000
privacy:
  version_private_content: false
  manifest_contains_only: [hashes, counts, dialect, metrics]
training:
  method: qlora
  source_adapter: artifacts/runs/phase-01-general-e1-768f209d9ea8
  max_sequence_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  num_train_epochs: 2
  learning_rate: 0.0001
