# Configuração de referência. Copiar para um arquivo local de execução e registrar
# o valor final empregado no relatório do experimento.
project:
  name: llm-to-sql-pt
  phase: general-sft
  seed: 42

data:
  primary_dataset: emdemor/sql-create-context-pt
  revision: ee31747c93bdf859c57468ec1f28c4360cc84b1b
  raw_dir: data/raw/emdemor__sql-create-context-pt/ee31747c93bd
  processed_dir: data/processed/phase-01/ee31747c93bd
  validation_strategy: group_by_normalized_schema
  validation_fraction: 0.10
  max_sequence_length: 1024

model:
  # Base de 4B escolhida para preservar VRAM no runtime agentic.
  base_model: Qwen/Qwen3-4B-Thinking-2507
  revision: 768f209d9ea81521153ed38c47d515654e938aea
  load_in_4bit: true
  quantization: nf4
  compute_dtype: bfloat16

adapter:
  method: qlora
  rank: 16
  alpha: 32
  dropout: 0.05

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.0002
  num_train_epochs: 2
  # Na API instalada, frações representam a proporção do total de passos.
  warmup_steps: 0.03
  logging_steps: 10
  save_strategy: steps
  save_steps: 250
  evaluation_strategy: steps
  eval_steps: 250

safety:
  target_sql_operations:
    - SELECT
    - WITH
    - EXPLAIN
  disallowed_sql_operations:
    - INSERT
    - UPDATE
    - DELETE
    - DROP
    - ALTER
    - CREATE
