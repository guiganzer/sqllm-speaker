[project]
name = "llm-to-sql-pt"
version = "0.1.0"
description = "Agente local de Text-to-SQL em português"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.31.0",
    "peft>=0.20.0",
    "sqlglot>=30.18.0",
    "torch==2.7.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
